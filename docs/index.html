<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Bot Store — tiny self-hosted bots</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --orange: #d29922; --red: #f85149; --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  header {
    padding: 80px 0 60px; text-align: center;
    background: radial-gradient(ellipse at 50% -50%, rgba(88,166,255,.15), transparent 70%);
  }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    display: flex; align-items: center; justify-content: center; font-size: 44px;
  }
  h1 { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
  h1 .accent { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 1.2rem; margin-top: 12px; max-width: 640px; margin-left: auto; margin-right: auto; }
  .stats { display: flex; gap: 32px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .stat .label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: 1px; }
  .cta-row { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 600;
    border: 1px solid var(--border); color: var(--text); background: var(--surface);
    transition: border-color .2s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #0d1117; }
  .btn.primary:hover { filter: brightness(1.1); }

  .search-row { margin: 48px 0 24px; }
  #search {
    width: 100%; padding: 14px 20px; font-size: 1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-bottom: 64px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; cursor: pointer; transition: border-color .2s, transform .15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .card .emoji { font-size: 1.6rem; }
  .card h3 { font-size: 1.1rem; font-family: ui-monospace, SFMono-Regular, monospace; }
  .card p { color: var(--muted); font-size: .92rem; flex: 1; }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: .72rem; padding: 2px 10px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.webhook { color: var(--accent); border-color: rgba(88,166,255,.4); }
  .tag.cron { color: var(--orange); border-color: rgba(210,153,34,.4); }

  /* modal */
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(1,4,9,.8);
    z-index: 10; padding: 40px 20px; overflow-y: auto;
  }
  #overlay.open { display: block; }
  #modal {
    max-width: 720px; margin: 0 auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px;
  }
  #modal h2 { font-family: ui-monospace, monospace; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #modal .desc { color: var(--muted); margin-bottom: 20px; }
  #modal h4 { margin: 20px 0 8px; color: var(--accent); font-size: .85rem; text-transform: uppercase; letter-spacing: 1px; }
  #modal pre {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; overflow-x: auto; font-size: .85rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  #modal ul { padding-left: 20px; color: var(--muted); }
  #modal table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  #modal td, #modal th { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
  #modal code { background: rgba(110,118,129,.2); padding: 1px 6px; border-radius: 4px; font-size: .85em; }
  #close {
    float: right; background: none; border: none; color: var(--muted);
    font-size: 1.5rem; cursor: pointer;
  }
  footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); text-decoration: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo">🤖</div>
    <h1>GitHub <span class="accent">Bot Store</span></h1>
    <p class="tagline">Twelve tiny, self-hosted GitHub bots. Each compiles to a single static binary small enough for a $4 VPS or a Raspberry Pi.</p>
    <div class="stats">
      <div class="stat"><div class="num">12</div><div class="label">bots</div></div>
      <div class="stat"><div class="num">~5MB</div><div class="label">per binary</div></div>
      <div class="stat"><div class="num">~10MB</div><div class="label">RAM each</div></div>
      <div class="stat"><div class="num">0</div><div class="label">dependencies</div></div>
    </div>
    <div class="cta-row">
      <a class="btn primary" href="https://github.com/sanketpatel32/github-bot-store">View on GitHub</a>
      <a class="btn" href="#quickstart">Quick start</a>
    </div>
  </div>
</header>

<main class="container">

  <section id="quickstart">
    <div class="search-row">
      <input id="search" type="text" placeholder="Search bots — try 'merge', 'label', 'stale'...">
    </div>
  </section>

  <div class="grid" id="grid"></div>

</main>

<div id="overlay">
  <div id="modal">
    <button id="close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  <div class="container">
    Built with Go, zero dependencies · <a href="https://github.com/sanketpatel32/github-bot-store">sanketpatel32/github-bot-store</a>
  </div>
</footer>

<script>
const BOTS = [
  {
    name: "pr-size-labeler", emoji: "📏", type: "webhook", port: 8101,
    desc: "Labels PRs size/XS through size/XL by lines changed, and nudges authors to split giant PRs.",
    events: "Pull requests", perms: "pull-requests: write, issues: write",
    notes: ["Creates the size/* labels automatically", "XL threshold is 800+ lines"]
  },
  {
    name: "first-touch-welcomer", emoji: "👋", type: "webhook", port: 8102,
    desc: "Posts a friendly welcome comment the first time someone opens an issue or PR.",
    events: "Issues, Pull requests", perms: "issues: write, pull-requests: write",
    notes: ["Skips owners, members, and collaborators", "First-timer detection via the search API"]
  },
  {
    name: "stale-bot", emoji: "🥀", type: "cron", port: 8103,
    desc: "Marks issues idle 30 days as stale, closes them 7 days later. Any activity resets the clock.",
    events: "None — polls every 12h", perms: "issues: write",
    notes: ["Requires REPO=owner/name env var", "STALE_DAYS and CLOSE_AFTER_DAYS configurable"]
  },
  {
    name: "branch-sweeper", emoji: "🧹", type: "webhook", port: 8104,
    desc: "Deletes the head branch automatically when a PR is merged.",
    events: "Pull requests", perms: "contents: write",
    notes: ["Never touches forks or protected branches (main, develop, release...)"]
  },
  {
    name: "conventional-pr-check", emoji: "✍️", type: "webhook", port: 8105,
    desc: "Commit status enforcing conventional-commit PR titles: feat:, fix:, chore: and friends.",
    events: "Pull requests", perms: "statuses: write, pull-requests: write",
    notes: ["Make it a required check in branch protection to block merges"]
  },
  {
    name: "reviewer-assigner", emoji: "👀", type: "webhook", port: 8106,
    desc: "Auto-assigns reviewers by which paths changed — a self-hosted mini-CODEOWNERS.",
    events: "Pull requests", perms: "pull-requests: write",
    notes: ["Configure path prefixes in reviewers.json", "Never assigns the author"]
  },
  {
    name: "duplicate-issue-hunter", emoji: "🔍", type: "webhook", port: 8107,
    desc: "Comments possible duplicates when a new issue's title overlaps existing ones.",
    events: "Issues", perms: "issues: write",
    notes: ["Only fires on 2+ keyword overlap — vague issues stay quiet"]
  },
  {
    name: "todo-tracker", emoji: "📝", type: "webhook", port: 8108,
    desc: "Opens a tracking issue for every new TODO/FIXME comment pushed to the default branch.",
    events: "Push", perms: "issues: write, contents: read",
    notes: ["Dedupes by content hash — no duplicates from merges"]
  },
  {
    name: "merge-conflict-detector", emoji: "⚔️", type: "webhook", port: 8109,
    desc: "When the default branch moves, warns open PRs that now conflict.",
    events: "Push", perms: "pull-requests: read, issues: write",
    notes: ["Retries once after 3s — GitHub computes mergeability async"]
  },
  {
    name: "auto-merger", emoji: "🚀", type: "webhook", port: 8110,
    desc: "Squash-merges PRs labeled 'automerge' as soon as checks go green.",
    events: "Pull requests, Check runs, Check suites, Status", perms: "pull-requests: write, contents: write",
    notes: ["Repos without CI count as green", "Create the automerge label first"]
  },
  {
    name: "repo-digest", emoji: "📊", type: "cron", port: 8111,
    desc: "Opens a weekly digest issue: merged PRs, issue stats, top contributors.",
    events: "None — runs every 7 days", perms: "issues: write",
    notes: ["Requires REPO=owner/name env var"]
  },
  {
    name: "pr-template-checker", emoji: "📋", type: "webhook", port: 8112,
    desc: "Nudges authors whose PR description is empty or missing template sections.",
    events: "Pull requests", perms: "issues: write",
    notes: ["REQUIRED_SECTIONS env var, e.g. 'summary,test plan'"]
  }
];

const grid = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const modalContent = document.getElementById("modal-content");

function render(filter = "") {
  grid.innerHTML = "";
  const q = filter.toLowerCase();
  for (const bot of BOTS) {
    if (q && !bot.name.includes(q) && !bot.desc.toLowerCase().includes(q)) continue;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="top"><span class="emoji">${bot.emoji}</span><h3>${bot.name}</h3></div>
      <p>${bot.desc}</p>
      <div class="meta">
        <span class="tag ${bot.type}">${bot.type === "cron" ? "cron" : "webhook"}</span>
        <span class="tag">:${bot.port}</span>
      </div>`;
    card.onclick = () => openModal(bot);
    grid.appendChild(card);
  }
}

function openModal(bot) {
  modalContent.innerHTML = `
    <h2>${bot.emoji} ${bot.name}</h2>
    <p class="desc">${bot.desc}</p>

    <h4>Build & run</h4>
    <pre>go build -o ${bot.name} ./bots/${bot.name}
export GITHUB_TOKEN=ghp_... WEBHOOK_SECRET=...
./${bot.name}   # listens on :${bot.port}</pre>

    <h4>Webhook setup</h4>
    <ul>
      <li>URL: <code>http://your-server:${bot.port}/webhook</code></li>
      <li>Content type: <code>application/json</code></li>
      <li>Events: <b>${bot.events}</b></li>
      <li>Permissions: <code>${bot.perms}</code></li>
    </ul>

    <h4>Notes</h4>
    <ul>${bot.notes.map(n => `<li>${n}</li>`).join("")}</ul>

    <h4>Links</h4>
    <ul>
      <li><a style="color:var(--accent)" href="https://github.com/sanketpatel32/github-bot-store/tree/main/bots/${bot.name}">Source & full README</a></li>
    </ul>`;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("close").onclick = () => {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
};
overlay.onclick = (e) => {
  if (e.target === overlay) {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  }
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") overlay.classList.remove("open");
});
document.getElementById("search").addEventListener("input", (e) => render(e.target.value));

render();
</script>
</body>
</html>
