{{- range .Values.bots }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: { app: {{ .name }} }
spec:
  replicas: 1   # bots are singletons — leaderless scaling is not safe for mutations
  strategy:
    # RollingUpdate (the default) briefly runs the old and new pod together —
    # two independently mutating workers. Recreate kills the old one first (#117)
    type: Recreate
  selector:
    matchLabels: { app: {{ .name }} }
  template:
    metadata:
      labels: { app: {{ .name }} }
    spec:
      containers:
        - name: bot
          image: "{{ $.Values.image.registry }}/{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: token } }
            - name: WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: webhook-secret } }
            - name: PORT
              value: "{{ .port }}"
            - name: BIND_ADDR
              value: "0.0.0.0"
            {{- if eq .type "cron" }}
            - name: REPO
              value: "{{ .repo }}"
            {{- end }}
            {{- if $.Values.spool.enabled }}
            - name: SPOOL_DIR
              value: /spool
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .port }} }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .port }} }
            periodSeconds: 10
          {{- if $.Values.spool.enabled }}
          volumeMounts:
            - { name: spool, mountPath: /spool }
          {{- end }}
      {{- if $.Values.spool.enabled }}
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: {{ .name }}-spool
      {{- end }}
---
{{- if $.Values.spool.enabled }}
# a durable inbox that evaporates on pod replacement is not durable — the
# spool gets a real persistent volume, not emptyDir (#116)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-spool
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: {{ $.Values.spool.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector: { app: {{ .name }} }
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
---
{{- end }}
