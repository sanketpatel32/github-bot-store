name: bots — scheduled

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  stale-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: restore stale state
        uses: actions/cache@v4
        with:
          path: stale-state.json
          key: stale-bot-state
          restore-keys: stale-bot-state
      - run: go run ./bots/stale-bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXEMPT_ASSIGNED: "true"

  repo-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go run ./bots/repo-digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
