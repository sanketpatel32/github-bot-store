name: bots — push

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  todo-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go run ./bots/todo-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-conflict-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go run ./bots/merge-conflict-detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
