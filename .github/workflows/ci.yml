name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt check
        run: |
          out=$(gofmt -l bots shared)
          if [ -n "$out" ]; then
            echo "not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: unit tests with race detector
        run: go test -race ./...

      - name: build all bots
        run: |
          set -e
          for bot in bots/*/; do
            name=$(basename "$bot")
            echo "building $name"
            go build -o "/tmp/$name" "./$bot"
          done

      - name: smoke — every binary answers /healthz
        run: |
          set -e
          for bot in bots/*/; do
            name=$(basename "$bot")
            port=$(grep -oP 'LoadConfig\(".*?",\s*"\K[0-9]+' "$bot/main.go" | head -1)
            [ -z "$port" ] && continue
            GITHUB_TOKEN=dummy REPO=dummy/dummy ALLOW_UNSIGNED_WEBHOOKS=true GITHUB_ACTIONS= PORT="$port" timeout 6 "/tmp/$name" &
            pid=$!
            ok=""
            for i in 1 2 3 4 5; do
              sleep 0.5
              if curl -sf "http://localhost:$port/healthz" 2>/dev/null | grep -q ok; then ok=1; break; fi
            done
            kill $pid 2>/dev/null || true
            [ -z "$ok" ] && { echo "$name healthz failed"; exit 1; }
            echo "$name: healthz ok"
          done
