name: bots — checks

on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  status: {}

permissions:
  checks: read
  issues: write
  contents: write
  pull-requests: write

jobs:
  ci-failure-commenter:
    if: github.event_name != 'status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/ci-failure-commenter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/auto-merger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  flaky-test-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # flake detection needs history across runs — without a persisted
      # state file every job starts blind and can never correlate a failure
      # with its later passing rerun (#122)
      - uses: actions/cache@v4
        with:
          path: flaky-state.json
          key: flaky-state-${{ github.run_id }}
          restore-keys: flaky-state-
      - run: go run ./bots/flaky-test-tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
