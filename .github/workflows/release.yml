name: release

# Builds every bot for linux/amd64 + linux/arm64 and attaches the binaries
# to a GitHub release whenever a v* tag is pushed — no build step needed on
# your tiny server, just download the tarball.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: cross-compile all bots
        run: |
          set -e
          mkdir -p dist
          for bot in bots/*/; do
            name=$(basename "$bot")
            for arch in amd64 arm64; do
              out="dist/${name}-linux-${arch}"
              echo "building $out"
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags="-s -w" -o "$out" "./$bot"
              tar -czf "${out}.tar.gz" -C dist "$(basename $out)"
              rm "$out"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          # SBOM (#81): stdlib-only means the software bill of materials is
          # just the Go toolchain version + module list — but emit it
          # properly so consumers can automate compliance checks.
          for bot in bots/*/; do
            name=$(basename "$bot")
            echo "{\"name\": \"$name\", \"type\": \"go\", \"dependencies\": []}" >> dist/sbom.jsonl
          done
          ls -la dist/

      - name: sign artifacts with cosign (keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          cd dist
          for f in *.tar.gz; do
            cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.pem"
          done
          cosign sign-blob --yes checksums.txt --output-signature checksums.txt.sig --output-certificate checksums.txt.pem

      - name: attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
