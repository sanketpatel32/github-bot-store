name: bots — pull requests

# Self-hosting: this repo uses its own bots, run as GitHub Actions.
# Each job is one bot, compiled and run once per event.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: read

jobs:
  pr-size-labeler:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/pr-size-labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-pr-check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/conventional-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-template-checker:
    if: github.event.action == 'opened' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/pr-template-checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  first-touch-welcomer:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/first-touch-welcomer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-sweeper:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/branch-sweeper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-drafter:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/release-drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/auto-merger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reviewer-assigner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/reviewer-assigner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pr-path-labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/pr-path-labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  changelog-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/changelog-checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  license-header-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/license-header-checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  breaking-change-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./bots/breaking-change-guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  contributor-milestones:
    runs-on: ubuntu-latest
